1911_Theatre_Of_Empires.TABLEGROUP.01;Japanese=objectiveAttachment_Japanese_1_Control_Dutch_East_Indies;objectiveAttachment_Japanese_2_Money_Islands;objectiveAttachment_Japanese_3_Army_In_North_America

